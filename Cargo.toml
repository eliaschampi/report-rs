[package]
name = "report-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Deterministic PDF report engine: one JSON manifest in, one JSON response out"

[dependencies]
# raster-images: PNG/JPEG embed (membrete, fotos, templates).
# simple-text (rustybuzz) desactivado a propósito: los runs de glifos se
# posicionan con ttf-parser (métricas idénticas a las usadas para wrap) —
# mismo modelo que pdf-lib con fuentes estándar, y −1 MB de binario.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
