[package]
name = "report-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Deterministic PDF report engine: one JSON manifest in, one JSON response out"

[dependencies]
krilla = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
